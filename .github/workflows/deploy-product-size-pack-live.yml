name: Deploy product size and pack UI to kmtbazaar.com

on:
  push:
    branches:
      - customer-live
    paths:
      - "frontend/app/vendor/products.tsx"
      - "frontend/app/vendor/store/**"
      - "frontend/app/product/**"
      - "frontend/src/components/ProductCard.tsx"
      - "frontend/app/(tabs)/home.tsx"
      - "frontend/app/search.tsx"
      - "frontend/src/api.ts"
      - "frontend/src/components/AnimatedBrandLogo.tsx"
      - "frontend/app/auth/login.tsx"
      - "frontend/app/admin/index.tsx"
      - "frontend/app/vendor/index.tsx"
      - "frontend/app/delivery/index.tsx"
      - "frontend/app/vendor/holiday-dashboard.tsx"
      - "frontend/app/vendor/car-rental-dashboard.tsx"
      - "frontend/app/role/[role].tsx"
      - "frontend/app/(tabs)/cart.tsx"
      - "frontend/app/addresses.tsx"
      - "frontend/app/checkout.tsx"
      - "backend/server.py"
      - "frontend/app/(tabs)/profile.tsx"
      - "frontend/app/index.tsx"
      - "frontend/src/components/ParticleLogoSplash.tsx"
      - "frontend/components/AIAssistant.tsx"
      - "frontend/components/BotHeader.tsx"
      - "frontend/app/assistant.tsx"
      - "frontend/src/components/RobotAvatar.tsx"
      - "frontend/src/components/RobotCompanion3D.tsx"
      - "frontend/app/(tabs)/_layout.tsx"
      - "frontend/src/api.ts"
      - ".github/workflows/deploy-product-size-pack-live.yml"
  workflow_dispatch:
    inputs:
      confirm_live_deploy:
        description: "Confirm deployment to kmtbazaar.com"
        required: true
        type: choice
        options:
          - "yes"

permissions:
  contents: read

concurrency:
  group: kmtbazaar-production-frontend
  # Keep deployments serialized; the VPS-side flock is a second safety guard.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.confirm_live_deploy == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Check required Hostinger SSH configuration
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$HOSTINGER_HOST" ] || missing+=("HOSTINGER_HOST")
          [ -n "$HOSTINGER_USER" ] || missing+=("HOSTINGER_USER")
          [ -n "$HOSTINGER_SSH_KEY" ] || missing+=("HOSTINGER_SSH_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository Actions secrets: ${missing[*]}"
            echo "Add these under Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: customer-live

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate size and pack options and customer display
        working-directory: frontend
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const vendor = fs.readFileSync("app/vendor/store/[id].tsx", "utf8");
          const customer = fs.readFileSync("app/product/[id].tsx", "utf8");
          const options = ["XS", "S", "M", "L", "XL", "XXL", "1 pc", "250 g", "500 g", "1 kg", "250 ml", "500 ml", "750 ml", "1 L", "2 L"];
          assert.ok(vendor.includes("const PRODUCT_UNIT_OPTIONS = ["), "Store vendor quick options are missing");
          assert.ok(vendor.includes("vendor-store-add-product-size-pack-picker"), "Actual store vendor Add Product screen must render size/pack options");
          assert.ok(vendor.includes("vendor-store-edit-product-size-pack-picker"), "Actual store vendor Edit Product screen must render size/pack options");
          assert.ok(vendor.includes("vendor-store-add-product-variants") && vendor.includes("vendor-store-edit-product-variants"), "Vendor must support multiple variants with separate price and stock.");
          assert.ok(customer.includes('testID="product-size-pack-selector"') && customer.includes("selectedPrice"), "Customer details must show size/pack options and update the price.");
          assert.ok(customer.includes("await add(p.id, 1, selectedVariant?.id)"), "Customer cart requests must carry the selected variant.");
          assert.ok(vendor.includes("vendor-store-add-product-item-category-picker"), "Add Product must render a separate item category panel");
          assert.ok(vendor.includes("vendor-store-edit-product-item-category-picker"), "Edit Product must render a separate item category panel");
          assert.ok(vendor.includes("vendor-store-add-new-item-category-name"), "Add Product must include a new item-category name field");
          assert.ok(vendor.includes("vendor-store-add-new-item-category"), "Add Product must include a create-category button");
          assert.ok(vendor.includes("vendor-store-edit-new-item-category-name"), "Edit Product must include a new item-category name field");
          assert.ok(vendor.includes("vendor-store-edit-new-item-category"), "Edit Product must include a create-category button");
          assert.ok(vendor.includes("createItemCategoryForProduct"), "Inline item-category creation handler missing");
          assert.ok(vendor.includes('testID="vendor-store-add-product-name"') && vendor.includes('testID="vendor-store-edit-product-name"'), "Full product name fields missing");
          assert.ok(vendor.includes("productNameInput") && vendor.includes("multiline"), "Long product names need multiline input");

          assert.ok(vendor.includes("vendor-store-add-product-shop-category"), "Add Product must show shop category in the top-right header");
          assert.ok(vendor.includes("vendor-store-edit-product-shop-category"), "Edit Product must show shop category in the top-right header");
          assert.ok(vendor.includes('backgroundColor: "#ECFDF5"') && vendor.includes('borderColor: "#6EE7B7"'), "Item category panel must use its distinct green/teal palette");
          assert.ok(vendor.includes('backgroundColor: "#FFF7ED"') && vendor.includes('borderColor: "#FDBA74"'), "Size/pack panel must retain its orange palette");
          assert.ok(vendor.includes("item_category_id: item.id"), "Item category selection must retain its ID");

          for (const option of options) assert.ok(vendor.includes(JSON.stringify(option)), `Missing option: ${option}`);
          assert.ok(vendor.includes("onPress={() => setForm((current) => ({ ...current, unit: option }))}"), "Add Product chip selection must update form state");
          assert.ok(vendor.includes("onPress={() => setEditProductForm((current) => ({ ...current, unit: option }))}"), "Edit Product chip selection must update form state");
          assert.ok(vendor.includes("...form,"), "Product request must spread saved form fields");
          assert.ok(customer.includes("selectedUnit"), "Customer detail must display the saved or selected unit.");
          assert.ok(customer.includes("testID=\"product-size-pack-selector\""), "Customer detail must show selectable size/pack options.");
          console.log("PRODUCT_SIZE_PACK_UI_VALIDATION_PASS");
          NODE

      - name: Validate animated Chhath-Diwali ghat hero, neon brand and home search placement
        working-directory: frontend
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const home = fs.readFileSync("app/(tabs)/home.tsx", "utf8");
          assert.ok(home.includes("function NightSky()") && home.includes("<FestivalDecor />"), "The animated Chhath–Diwali festival scene must render in the home hero");
          assert.ok(home.includes("function FestivalDecor()") && home.includes("FESTIVAL_BULBS"), "Festival lighting and atmospheric backdrop must be present");
          assert.ok(home.includes("FESTIVAL_LANTERNS") && home.includes("FESTIVAL_FIREWORKS") && home.includes("function FestivalLantern") && home.includes("function FestivalFirework"), "Floating lanterns and animated fireworks must be present");
          assert.ok(home.includes("function FestivalSugarcane") && home.includes("home-festival-sugarcane") && home.includes("function FestivalChhathSoop") && home.includes("home-chhath-soop"), "Chhath sugarcane stalks and dala/sup offering must be present");
          assert.ok(home.includes("festivalGhatStepOne") && home.includes("festivalWaterShimmer") && home.includes("festivalDiyaFlame"), "Ghat steps, moving water reflections and diyas must be present");
          assert.ok(!home.includes("chhath-hero-240-q26.webp"), "The old flat GIF/WebP image must not replace the animated festival scene");
          assert.ok(!home.includes('testID="home-location-neon-glow"') && !home.includes("headerNeonGlow"), "Neon bar between location and notification must remain removed");
          assert.ok(home.includes('testID="home-hero-brand-neon"') && home.includes("KMT BAZAAR") && home.includes("heroBrandNeon:") && home.includes('textShadowColor: "#FFC928"'), "Pre-GIF KMT Bazaar hero neon text must render");
          assert.ok(home.includes('backgroundColor: "rgba(22,163,74,0.22)"') && home.includes('borderColor: "rgba(134,239,172,0.72)"') && home.includes("borderRadius: 8"), "Home search field must retain translucent green styling and square corners");
          const heroHeightLine = home.includes("const heroExpandedHeight = HERO_BACKDROP_HEIGHT;");
          const searchStyleLine = home.includes("style={s.searchWrap}") && !home.includes("translateY: -24");
          const searchPosition = home.indexOf('testID="home-search-trigger"');
          const bannerPosition = home.indexOf("<View style={s.bannerCarouselShell}>");
          assert.ok(heroHeightLine && searchStyleLine && searchPosition > 0 && bannerPosition > searchPosition && home.includes("paddingTop: SPACING.lg"), "Home search must render directly below the full hero and above the banner");
          assert.ok(home.includes('backgroundColor: "transparent", zIndex: 20, elevation: 0'), "Home search area must not paint a white panel over the animated sky");
          assert.ok(home.includes("onPress={openHomeSearch}") && !home.includes('onPress={() => router.push("/search" as any)}'), "Home search must open in place without pushing a separate screen");
          assert.ok(home.includes('testID="home-search-overlay"') && home.includes("<BlurView"), "Home search must blur the existing page behind its overlay");
          assert.ok(home.includes("api.products({ limit: 500 })") && home.includes('testID="home-search-product-list"') && home.includes("homeSearchRows.map") && home.includes("homeSearchProductRow") && home.includes("<ProductCard p={item} compact />"), "Home search overlay must render visible product cards in explicit two-column rows");
          assert.ok(home.includes('const homeSearchRows = useMemo') && home.includes('homeSearchResultsScroll: { flex: 1, minHeight: 0, width: "100%" }') && home.includes("homeSearchResultsGrid: { flexGrow: 1"), "Home search product list must have a visible, expanding scroll layout");
          assert.ok(home.includes('setHomeSearchQuery(transcript)') && home.includes("void saveHomeRecentSearch(transcript)") && !home.includes('router.push({ pathname: "/search"'), "Voice search must show results and save history in the current Home overlay without opening /search");
          assert.ok(home.includes('testID="home-search-mic"') && home.includes("onPress={handleHomeOverlayVoicePress}") && home.includes("event?.stopPropagation?.();"), "Home search overlay must keep voice search on the same screen without bubbling taps");
          assert.ok(home.includes("event?.stopPropagation?.();") && home.includes("startVoiceSearch();"), "Home mic tap must not bubble into the separate search-bar tap handler");
          const productApi = fs.readFileSync("src/api.ts", "utf8");
          assert.ok(productApi.includes("limit?: number") && productApi.includes('qs.set("limit", String(params.limit))'), "Product API must support the requested search-catalogue limit");
          assert.ok(home.includes('testID="home-search-back"') && home.includes('accessibilityLabel="Back to home"') && home.includes('name="arrow-left"') && home.includes('window.history.pushState') && home.includes('window.addEventListener("popstate", handleBrowserBack)') && home.includes('BackHandler.addEventListener("hardwareBackPress"'), "Search back action must return to home on web and native devices");
          assert.ok(home.includes('const RECENT_SEARCHES_KEY = "kmt_recent_searches"') && home.includes("const MAX_RECENT_SEARCHES = 5") && home.includes("AsyncStorage.getItem(RECENT_SEARCHES_KEY)") && home.includes("AsyncStorage.setItem(RECENT_SEARCHES_KEY") && home.includes('testID="home-search-recent-history"') && home.includes("onSubmitEditing={handleHomeSearchSubmit}"), "Home search must preserve five persistent recent searches");
          assert.ok(home.includes('homeSearchProductCell: { width: "48.5%"') && home.includes('homeSearchProductRow: { width: "100%"'), "Home search products must use fixed-width two-column rows");
          const search = fs.readFileSync("app/search.tsx", "utf8");
          assert.ok(search.includes("}, [allProducts, query]);"), "Search results must recalculate when products load or the query changes");
          assert.ok(search.includes("product?.product_name") && search.includes("product?.productName") && search.includes("product?.title"), "Search must match legacy product name fields as well as the current name");
          assert.ok(search.includes("Array.isArray(data)"), "Search must normalize the product list API response before filtering");
          assert.ok(home.includes("width: Math.min((width - SPACING.lg * 2 - 10) / 2, 190)") && home.includes("storeCardSmall: { width: Math.min((width - SPACING.lg * 2 - 10) / 2, 190), height: 112") && home.includes("storeImgSmall: { width: \"100%\", height: 64 }"), "Nearby store cards must fit exactly two across the screen while preserving the original card and image heights");
          assert.ok(!home.includes("Search 'medicines'..."), "Medicine must be removed from animated home search suggestions");
          assert.ok(["Search 'groceries'...", "Search 'fresh food'...", "Search 'electronics'...", "Search 'daily essentials'..."].every((suggestion) => home.includes(suggestion)), "All other animated search suggestions must remain");
          assert.ok(home.includes('heroBrandNeon: { color: "#FFF7D6"') && home.includes("transform: [{ translateY: -26 }]"), "KMT Bazaar hero neon text must be shifted above its previous position");
          assert.ok(home.includes('searchPlaceholderText: { fontSize: 16, color: "#FFFFFF", fontWeight: "500"'), "Home search suggestion text must be larger, white, and less bold");
          assert.ok(home.includes("const BANNER_W = Math.max(0, width - 24);") && home.includes("paddingHorizontal: SPACING.md") && home.includes("bannerItemWrap: { width: BANNER_W, flexShrink: 0"), "Home banners must be wider with consistent 12px side gutters");
          assert.ok(home.includes('bannerCarouselShell: { position: "relative", width: "100%", alignSelf: "stretch", minWidth: 0, overflow: "hidden"') && home.includes('overflowY: "hidden"'), "Banner carousel must stay clipped to its own viewport so it cannot cross the Shop by Category orange indicator");
          assert.ok(home.includes("ref={bannerListRef}") && !home.includes("ref={(ref) =>") && home.includes("bannerScrollOffsetRef.current") && home.includes("Math.abs(bannerScrollOffsetRef.current - targetOffset) > 2"), "Carousel must use one stable list ref and avoid duplicate scroll animations during re-renders");
          assert.ok(home.includes('decelerationRate="fast"') && home.includes("disableIntervalMomentum") && home.includes('snapToAlignment="start"'), "Home banner swipes must snap cleanly and smoothly to one banner");
          assert.ok(home.includes("sectionIndicator: { width: 4, height: 16, backgroundColor: THEME.orange"), "The orange Shop by Category indicator must remain in its original position and styling");
          const brandClearStars = home.split("const HERO_BRAND_CLEAR_STAR_INDICES = new Set([")[1]?.split("]);")[0];
          assert.ok(brandClearStars && brandClearStars.split(",").length === 7 && home.includes("HERO_BRAND_CLEAR_STAR_INDICES.has(index)"), "Exactly seven small sky dots must be removed from the KMT Bazaar wordmark area");
          assert.ok(home.includes("function FestivalChhathWoman()") && home.includes('testID="home-chhath-woman"') && home.includes("FestivalChhathWoman />"), "Home festival animation must show the Chhath woman on the left side of the ghat");
          assert.ok(home.includes("festivalWomanSoop:") && home.includes("festivalWomanHandTop:") && home.includes("festivalWomanHandBottom:") && home.includes("festivalWomanSariDrape:"), "Chhath woman must be dressed in a traditional sari and visibly holding the offering soop");
          assert.ok(home.includes("offeringLift.value") && home.includes("festivalWomanOffering") && home.includes('testID="home-chhath-arghya-sun"'), "The woman must gently lift the soop towards a visible sun during the arghya animation");
          console.log("HOME_HERO_NEON_AND_SEARCH_SUGGESTIONS_VALIDATION_PASS");
          console.log("CHHATH_DIWALI_GHAT_HERO_VALIDATION_PASS");
          console.log("HOME_SEARCH_GREEN_TRANSPARENT_BELOW_HERO_VALIDATION_PASS");
          NODE

      - name: Validate animated brand logo across panels
        working-directory: frontend
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const logo = fs.readFileSync("src/components/AnimatedBrandLogo.tsx", "utf8");
          assert.ok(logo.includes("withRepeat") && logo.includes("useAnimatedStyle"), "Logo must use UI-thread animation");
          assert.ok(logo.includes("PARTICLE_COLORS") && logo.includes("rotateX") && logo.includes("rotateY"), "3D particles/depth are missing");
          assert.ok(logo.includes("export function BrandingFooter"), "Shared animated footer is missing");
          const files = ["app/auth/login.tsx","app/admin/index.tsx","app/vendor/index.tsx","app/delivery/index.tsx","app/vendor/holiday-dashboard.tsx","app/vendor/car-rental-dashboard.tsx","app/(tabs)/home.tsx","app/(tabs)/profile.tsx","app/(tabs)/cart.tsx","app/role/[role].tsx"];
          for (const file of files) {
            const source = fs.readFileSync(file, "utf8");
            assert.ok(source.includes("AnimatedBrandLogo") || source.includes("BrandingFooter"), `Missing animated brand in ${file}`);
          }
          console.log("ANIMATED_BRANDING_VALIDATION_PASS");
          NODE

      - name: Lint changed product and branding screens
        working-directory: frontend
        run: npx eslint "app/vendor/store/[id].tsx" "app/vendor/products.tsx" "app/product/[id].tsx" "src/components/ProductCard.tsx" "src/components/AnimatedBrandLogo.tsx" "app/auth/login.tsx" "app/admin/index.tsx" "app/delivery/index.tsx" "app/vendor/holiday-dashboard.tsx" "app/vendor/car-rental-dashboard.tsx" "app/role/[role].tsx" "app/(tabs)/profile.tsx" "app/(tabs)/cart.tsx" "app/addresses.tsx" "app/checkout.tsx" "app/index.tsx" "app/search.tsx" "src/components/ParticleLogoSplash.tsx" "components/AIAssistant.tsx" "components/BotHeader.tsx" "app/assistant.tsx" "components/ChatBubble.tsx" "components/TypingIndicator.tsx" "src/components/RobotAvatar.tsx" "src/components/RobotCompanion3D.tsx" "app/(tabs)/_layout.tsx" "src/api.ts" --no-cache

      - name: Validate particle-forming splash and black-background removal
        working-directory: frontend
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const splash = fs.readFileSync("src/components/ParticleLogoSplash.tsx", "utf8");
          const entry = fs.readFileSync("app/index.tsx", "utf8");
          const backend = fs.readFileSync("../backend/server.py", "utf8");
          assert.ok(splash.includes("getImageData"), "Splash must sample the original logo pixels");
          assert.ok(splash.includes("brightest < 26") && splash.includes("luminance < 31"), "Black background pixels must be excluded");
          assert.ok(splash.includes("requestAnimationFrame") && splash.includes("perspective"), "Particle assembly must animate in 3D");
          assert.ok(splash.includes("window.innerWidth") && splash.includes("window.innerHeight"), "Particle canvas must size itself to the full viewport");
          assert.ok(splash.includes("const particleFade = 1 - smoothStep(3.65, 4.35, elapsed) * 0.78;"), "Particle field must settle into the clean logo reveal");
          assert.ok(splash.includes("context.drawImage(\n          logoCanvas,\n          cropX, cropY, cropWidth, cropHeight,\n          logoLeft, logoTop, logoDrawWidth, logoDrawHeight"), "Final reveal must restore the crisp sampled logo");
          assert.ok(splash.includes("shineContext.createLinearGradient") && splash.includes('globalCompositeOperation = "source-in"'), "Final logo must receive a masked moving shine sweep");
          assert.ok(splash.includes('position: "absolute"') && splash.includes('height: "100%"'), "Splash canvas wrapper must fill the screen");
          assert.ok(splash.includes("MAX_PARTICLES = 11000"), "Particle count must remain bounded for mobile performance");
          assert.ok(entry.includes("<ParticleLogoSplash />"), "Opening splash must use the particle logo");
          assert.ok(!entry.includes('source={require("../assets/images/splash-icon.png")}'), "Old static splash image must be removed");
          assert.ok(entry.includes('backgroundColor: "#000000"'), "Web splash must use a pure black background");
          assert.ok(entry.includes("}, 6000);"), "Splash must hold the sharp logo and shine reveal before welcome screen");
          assert.ok(backend.includes('@api.get("/assistant/welcome-audio")'), "Backend must expose the cached welcome TTS route");
          assert.ok(backend.includes('WELCOME_TTS_MODEL = "gemini-3.8-flash-tts"'), "Welcome voice must use the supported Gemini TTS model");
          assert.ok(backend.includes("WELCOME_AUDIO_LOCK") && backend.includes("WELCOME_AUDIO_CACHE_PATH"), "Welcome audio generation must be cached and concurrency guarded");
          assert.ok(entry.includes("/api/assistant/welcome-audio?v=2"), "Assistant screen must play the generated Hindi welcome audio");
          assert.ok(entry.includes("talking={greetingPlaying}") && entry.includes("<RobotAvatar"), "Welcome robot mouth lights must follow the greeting audio");
          assert.match(entry, /mainContent:\s*\{[\s\S]*?justifyContent:\s*"center"/, "Welcome assistant layout must be vertically centered");
          assert.match(entry, /characterContainer:\s*\{[\s\S]*?position:\s*"absolute"[\s\S]*?top:\s*0[\s\S]*?bottom:\s*0[\s\S]*?justifyContent:\s*"center"/, "Assistant character layer must be centered on the full screen");
          assert.ok(entry.includes('pointerEvents="box-none">') && entry.includes('styles.characterWrapper} pointerEvents="box-none"'), "Center overlay must pass through taps outside the robot");
          assert.ok(entry.includes("style={{ width: assistantSize, height: assistantSize, alignItems: \"center\", justifyContent: \"center\" }}"), "Robot touch target must be limited to the visible circle");
          assert.ok(entry.includes("onPress={() => router.replace(\"/(tabs)/home\")}"), "Let's get started must open the storefront home before customer login");
          const routes = fs.readFileSync("app/_layout.tsx", "utf8");
          const cart = fs.readFileSync("src/CartContext.tsx", "utf8");
          const login = fs.readFileSync("app/auth/login.tsx", "utf8");
          const registration = fs.readFileSync("app/auth/register.tsx", "utf8");
          assert.ok(routes.includes('[\"home\", \"categories\", \"cart\"].includes(second)') && routes.includes('[\"category\", \"home-category\", \"store\", \"product\", \"search\"].includes(first)'), "Guests must be allowed to browse the customer storefront");
          assert.ok(cart.includes("PENDING_CART_ADD_KEY") && cart.includes('pathname: "/auth/login"') && cart.includes("api.cartAdd(") && cart.includes('router.replace("/(tabs)/cart" as any)'), "Guest cart actions must require login and restore the pending item into the customer cart");
          assert.ok(cart.includes("quantity: qty") && cart.includes("variant: variant ?? null"), "Pending cart restoration must preserve quantity and selected variant");
          assert.ok(login.includes('const fromCart = params.source === "cart"') && login.includes('returnTo: fromCart ? "cart" : undefined'), "Existing login and Google signup handoff must preserve cart intent");
          assert.ok(registration.includes('const fromCart = params.returnTo === "cart"') && registration.includes('role: fromCart ? "customer" : role'), "Cart-originated signup must create a customer account only");
          assert.ok(entry.includes('utterance.lang = "hi-IN"') && entry.includes("utterance.pitch = 1.2"), "Browser fallback must use a youthful Hindi speech profile");
          console.log("PARTICLE_SPLASH_TRANSPARENT_LOGO_VALIDATION_PASS");
          console.log("ASSISTANT_WELCOME_TTS_LIPSYNC_VALIDATION_PASS");
          NODE

      - name: Validate Google sign-in bootstrap and robotic login assistant
        working-directory: frontend
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const login = fs.readFileSync("app/auth/login.tsx", "utf8");
          const api = fs.readFileSync("src/api.ts", "utf8");
          const assistant = fs.readFileSync("components/AIAssistant.tsx", "utf8");
          const robot = fs.readFileSync("src/components/RobotAvatar.tsx", "utf8");
          const robot3d = fs.readFileSync("src/components/RobotCompanion3D.tsx", "utf8");
          const assistantScreen = fs.readFileSync("app/assistant.tsx", "utf8");
          const botHeader = fs.readFileSync("components/BotHeader.tsx", "utf8");
          const chatBubble = fs.readFileSync("components/ChatBubble.tsx", "utf8");
          const typingIndicator = fs.readFileSync("components/TypingIndicator.tsx", "utf8");
          const tabs = fs.readFileSync("app/(tabs)/_layout.tsx", "utf8");
          const home = fs.readFileSync("app/(tabs)/home.tsx", "utf8");
          const index = fs.readFileSync("app/index.tsx", "utf8");
          const backend = fs.readFileSync("../backend/server.py", "utf8");
          assert.ok(login.includes("api.googleConfig()"), "Login must load the OAuth client ID from backend configuration");
          assert.ok(login.includes("google.accounts.id.initialize") && login.includes("google.accounts.id.renderButton"), "Google Identity Services button must be initialized");
          assert.ok(!login.includes("EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID"), "Login must not rely on a separate build-time OAuth client ID");
          assert.ok(api.includes('"/auth/google/config"'), "Frontend API must expose Google OAuth configuration");
          assert.ok(backend.includes('@api.get("/auth/google/config")'), "Backend must expose Google OAuth configuration");
          assert.ok(assistant.includes("RobotCompanion3D") && assistant.includes("orbitRotation") && assistant.includes("lightPulse") && robot3d.includes('testID="login-ai-assistant"'), "Login assistant must use the glowing interactive 3D robot");
          assert.ok(robot3d.includes("pointerdown") && robot3d.includes("pointermove") && robot3d.includes("PanResponder") && robot3d.includes("GLView") && robot3d.includes("gl.endFrameEXP()"), "3D robot must support drag rotation on web and touch rotation on native Android/iOS");
          assert.ok(robot3d.includes("youthful boy face") && robot3d.includes("hairCapGeometry") && robot3d.includes("smileCurve") && robot3d.includes("faceSkin"), "3D robot must show the new friendly boy-style face");
          assert.ok(robot3d.includes("hairSweepCurve") && robot3d.includes("eyeWhites") && robot3d.includes("eyeHighlights") && robot3d.includes("blinkPhase") && robot3d.includes("0x754321") && robot3d.includes("eyeRings"), "Assistant mascot must have a cute polished face, warm expressive eyes with cyan rings and natural blinking on web/native");
          assert.ok(robot3d.includes("greetingUntil") && robot3d.includes("greetingUntilRef") && robot3d.includes("2.2 + Math.sin"), "Robot tap must play a head-nod and hand-wave greeting before navigation");
          assert.ok(assistant.includes("size={76}") && assistant.includes("width: 100") && assistant.includes("height: 112"), "Login floating robot must be smaller than the previous full-size mascot");
          assert.ok(!home.includes("AIAssistant") && !home.includes('placement="home"'), "Home must not retain the left floating robot");
          const tabOrder = ['name="home"', 'name="categories"', 'name="cart"', 'name="profile"', 'name="ai"'].map((name) => tabs.indexOf(name));
          assert.ok(tabOrder.every((position) => position >= 0) && tabOrder.every((position, i) => i === 0 || position > tabOrder[i - 1]), "Bottom tabs must be ordered Home, Categories, Cart, Profile, Assistant");
          assert.ok(tabs.includes("interactive") && tabs.includes('size={48}') && tabs.includes("height: 82") && tabs.includes("assistantTabIconActive") && tabs.includes('onActivate={() => router.push("/assistant")}'), "Far-right assistant tab must show the enlarged 3D robot with its glow, drag and tap controls");
          assert.ok(!tabs.includes("tabPress:") && tabs.split('router.push("/assistant")').length - 1 === 1, "Assistant taskbar tap must have exactly one navigation handler to prevent double-open/back-stack duplication");
          assert.ok(!home.includes("HomeRobotCompanion") && !home.includes("home-robot-companion"), "Home must not render the draggable/floating robot");
          assert.ok(robot3d.includes("redArmor") && robot3d.includes("sneakerRed") && robot3d.includes("handPivots") && robot3d.includes("idleWave") && robot3d.includes("blinkPhase"), "3D mascot must match the red-jacket robot boy with articulated hands, eye blinking and periodic hand waves");
          assert.ok(!assistantScreen.includes("assistant-banner.png") && !assistantScreen.includes("bannerContainer") && !assistantScreen.includes("Home Offers") && !assistantScreen.includes("assistant-home-banner-link") && !fs.existsSync("assets/ai/assistant-banner.png"), "Assistant banner system and Home Offers shortcut must be removed, including the unused banner asset");
          assert.ok(assistantScreen.includes("BlurView") && assistantScreen.includes("LinearGradient") && assistantScreen.includes("panelGlassTint") && assistantScreen.includes("Roojgar / Jobs"), "Assistant screen must use transparent glass holographic surfaces and retain Roojgar/Jobs");
          assert.ok(botHeader.includes("KMT Bazaar Live AI") && botHeader.includes("RobotCompanion3D") && botHeader.includes("size={54}"), "Assistant header must show KMT Bazaar Live AI beside the retained robot");
          assert.ok(assistantScreen.includes('testID="assistant-enter-button"') && assistantScreen.includes('name="keyboard-return"') && assistantScreen.includes("onSubmitEditing={onSend}") && assistantScreen.includes("disabled={!input.trim() || typing}"), "Assistant composer must use a laptop-style Enter key and keep keyboard Enter submission");
          assert.ok(assistantScreen.includes('backgroundColor: "#F97316"') && assistantScreen.includes('minHeight: 32') && assistantScreen.includes('alignSelf: "flex-start"'), "Roojgar/Jobs shortcut must be compact and orange");
          assert.ok(assistantScreen.includes('borderColor: "rgba(34,211,238,0.58)"') && assistantScreen.includes('backgroundColor: "rgba(5,15,29,0.66)"'), "Assistant panel must retain the transparent sci-fi hologram frame");
          assert.ok(botHeader.includes("BlurView") && botHeader.includes("rgba(224,242,254,0.075)") && chatBubble.includes("rgba(226,245,255,0.095)") && typingIndicator.includes("rgba(226,245,255,0.12)"), "Assistant header, messages and typing indicator must share the frosted hologram theme");
          assert.ok(tabs.includes('backgroundColor: "#FFFFFF"') && tabs.includes('borderColor: "#FFFFFF"'), "Assistant taskbar robot halo must be white");
          assert.ok(robot.includes("talking") && robot.includes("orbitRotation") && robot.includes("mouthPulse") && robot.includes("#67E8F9"), "Robot avatar must animate its lights and talking indicator");
          assert.ok(index.includes("RobotAvatar") && !index.includes("AssistantChar") && !index.includes("assistant-char.png"), "Post-splash welcome screen must not render the old static assistant PNG");
          assert.ok(login.includes("googleButtonContainerRef") && login.includes("response.credential"), "Google sign-in must initialize against its mounted button container and handle the returned credential");
          assert.ok(login.includes("use_fedcm_for_button: true") && login.includes("button_auto_select: false"), "Chrome Google sign-in must use the browser account chooser and require explicit account selection");
          assert.ok(login.includes("Google sign-in is only for existing customer accounts. Please enter your KMT Bazaar login details manually."), "Non-customer Google accounts must be told to use manual login");
          const googleHandler = login.slice(login.indexOf("const finishGoogleLogin ="), login.indexOf("const finishGoogleLoginRef"));
          assert.ok(googleHandler.includes("result.signup_required") && googleHandler.includes('pathname: "/auth/register"'), "Existing Google signup flow must remain intact for new email addresses");
          assert.ok(!googleHandler.includes('result.user.role !== "customer"'), "Customer-only role enforcement must remain in the existing backend authorization path");
          assert.ok(backend.includes('if user.get("role") != Role.CUSTOMER.value:') && backend.includes("Please use your KMT account login for this account"), "Google login backend must continue to reject non-customer accounts");
          assert.ok(login.includes("/Please use your KMT account login for this account/i") && login.includes("GOOGLE_CUSTOMER_ONLY_MESSAGE"), "Non-customer Google login must show the manual-login instruction");
          assert.ok(!assistant.includes("styles.statusLight"), "Robot must not reference a missing style");
          console.log("GOOGLE_SIGN_IN_BOOTSTRAP_VALIDATION_PASS");
          console.log("LOGIN_ROBOT_ANIMATION_VALIDATION_PASS");
          NODE

      - name: Validate single-PIN product delivery restriction
        working-directory: frontend
        run: |
          node <<'NODE'
          const fs = require("fs");
          const assert = require("assert");
          const api = fs.readFileSync("src/api.ts", "utf8");
          const cart = fs.readFileSync("app/(tabs)/cart.tsx", "utf8");
          const checkout = fs.readFileSync("app/checkout.tsx", "utf8");
          const addresses = fs.readFileSync("app/addresses.tsx", "utf8");
          const backend = fs.readFileSync("../backend/server.py", "utf8");
          assert.ok(api.includes('PRODUCT_DELIVERY_STATE = "Jharkhand"') && api.includes('PRODUCT_DELIVERY_PINCODE = "815352"'), "Product delivery state/PIN must be Jharkhand/815352");
          assert.ok(api.includes("normalizeProductDeliveryAddress") && cart.includes("normalizeProductDeliveryAddress"), "Cached and fetched addresses must use the canonical state/PIN");
          assert.ok(cart.includes("isProductDeliveryAvailableAtPincode") && cart.includes("disabled={busy || deliveryUnavailable}"), "Cart must block non-serviceable PIN codes");
          assert.ok(checkout.includes("selectedAddressUnavailable") && checkout.includes("delivery-availability"), "Checkout must display and enforce selected PIN serviceability");
          assert.ok(addresses.includes("PRODUCT_DELIVERY_MAP_CENTER") && !addresses.includes("25.5941"), "Address map must not fall back to Patna");
          assert.ok(addresses.includes('value={PRODUCT_DELIVERY_STATE} editable={false}') && addresses.includes('value={PRODUCT_DELIVERY_PINCODE} editable={false}'), "Address form state/PIN must be fixed");
          assert.ok(checkout.includes('v={PRODUCT_DELIVERY_STATE} editable={false}') && checkout.includes('v={PRODUCT_DELIVERY_PINCODE} editable={false}'), "Checkout address form state/PIN must be fixed");
          assert.ok(backend.includes('PRODUCT_DELIVERY_PINCODE = "815352"') && backend.includes("delivery_pincode != PRODUCT_DELIVERY_PINCODE"), "Backend checkout must enforce PIN 815352");
          assert.ok(backend.includes('update_data.pop("latitude", None)') && backend.includes('update_data.pop("longitude", None)'), "Address PIN edits must preserve saved GPS coordinates");
          console.log("SINGLE_PIN_PRODUCT_DELIVERY_VALIDATION_PASS");
          NODE

      - name: Build web app
        working-directory: frontend
        run: npm run build:web

      - name: Configure SSH
        id: ssh
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail
          PORT="${HOSTINGER_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" > "$HOME/.ssh/kmt_bazaar_deploy_key"
          chmod 600 "$HOME/.ssh/kmt_bazaar_deploy_key"
          ssh-keyscan -p "$PORT" -H "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          printf 'port=%s\n' "$PORT" >> "$GITHUB_OUTPUT"

      - name: Package built website
        working-directory: frontend
        run: tar -czf "$RUNNER_TEMP/kmt-bazaar-dist.tar.gz" -C dist .

      - name: Upload web build to production server
        timeout-minutes: 15
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          DEST="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          ARCHIVE="/tmp/kmt-bazaar-size-pack-${GITHUB_SHA}.tar.gz"
          LOCAL_ARCHIVE="$RUNNER_TEMP/kmt-bazaar-dist.tar.gz"
          LOCAL_BYTES=$(stat -c '%s' "$LOCAL_ARCHIVE")
          echo "ARCHIVE_BYTES=$LOCAL_BYTES"
          echo "REMOTE_CHECK_START"
          timeout 45s ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$HOME/.ssh/kmt_bazaar_deploy_key" -p "$HOSTINGER_PORT" "$DEST" "test -d /var/www/kmt-bazaar-com"
          echo "REMOTE_CHECK_PASS"
          echo "STREAM_UPLOAD_START"
          timeout 720s ssh -T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$HOME/.ssh/kmt_bazaar_deploy_key" -p "$HOSTINGER_PORT" "$DEST" "umask 077; cat > '$ARCHIVE'" < "$LOCAL_ARCHIVE"
          echo "STREAM_UPLOAD_FINISHED"
          REMOTE_BYTES=$(timeout 45s ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$HOME/.ssh/kmt_bazaar_deploy_key" -p "$HOSTINGER_PORT" "$DEST" "stat -c '%s' '$ARCHIVE'")
          echo "REMOTE_ARCHIVE_BYTES=$REMOTE_BYTES"
          test "$LOCAL_BYTES" = "$REMOTE_BYTES"
          echo "UPLOAD_COMPLETE"

      - name: Backup, deploy, and verify production
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          DEST="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          ssh -i "$HOME/.ssh/kmt_bazaar_deploy_key" -p "$HOSTINGER_PORT" "$DEST" "DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          exec 9>/run/kmt-bazaar-size-pack-deploy.lock
          flock -n 9 || { echo "STOP: Another size/pack deployment is running."; exit 1; }

          WEBROOT=/var/www/kmt-bazaar-com
          ARCHIVE="/tmp/kmt-bazaar-size-pack-${DEPLOY_SHA}.tar.gz"
          STAGING="/tmp/kmt-bazaar-size-pack-stage-${DEPLOY_SHA}"
          BACKUP="/var/www/kmt-bazaar-com-backup-size-pack-${DEPLOY_SHA:0:12}-$(date +%Y%m%d-%H%M%S)"

          test -s "$ARCHIVE"
          test -d "$WEBROOT"
          mkdir -p "$STAGING"
          tar -xzf "$ARCHIVE" -C "$STAGING"
          test -s "$STAGING/index.html"
          nginx -t

          mkdir -p "$BACKUP"
          cp -a "$WEBROOT"/. "$BACKUP"/

          rollback() {
            echo "ROLLBACK_START"
            find "$WEBROOT" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            cp -a "$BACKUP"/. "$WEBROOT"/
            systemctl reload nginx || true
            echo "ROLLBACK_BACKUP=$BACKUP"
          }

          if ! cp -a "$STAGING"/. "$WEBROOT"/; then
            rollback
            exit 1
          fi

          if ! systemctl reload nginx; then
            rollback
            exit 1
          fi

          HOME_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve kmtbazaar.com:443:127.0.0.1 https://kmtbazaar.com/ || true)
          STORES_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve kmtbazaar.com:443:127.0.0.1 https://kmtbazaar.com/api/stores || true)
          PRODUCTS_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve kmtbazaar.com:443:127.0.0.1 https://kmtbazaar.com/api/products || true)

          # Wait for the targeted backend patch so the new login screen never ships
          # without its matching Google OAuth configuration endpoint.
          GOOGLE_CONFIG_CODE=0
          for ATTEMPT in $(seq 1 12); do
            GOOGLE_CONFIG_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 --resolve kmtbazaar.com:443:127.0.0.1 https://kmtbazaar.com/api/auth/google/config || true)
            if [ "$GOOGLE_CONFIG_CODE" = "200" ]; then
              break
            fi
            echo "GOOGLE_CONFIG_WAIT attempt=$ATTEMPT"
            sleep 5
          done

          echo "HOME=$HOME_CODE"
          echo "STORES=$STORES_CODE"
          echo "PRODUCTS=$PRODUCTS_CODE"
          echo "GOOGLE_CONFIG=$GOOGLE_CONFIG_CODE"
          echo "BACKUP=$BACKUP"

          if [ "$HOME_CODE" != "200" ] || [ "$STORES_CODE" != "200" ] || [ "$PRODUCTS_CODE" != "200" ] || [ "$GOOGLE_CONFIG_CODE" != "200" ]; then
            echo "VERIFICATION_FAIL"
            rollback
            exit 1
          fi

          rm -rf "$STAGING" "$ARCHIVE"
          echo "DEPLOYMENT_HEALTH_CHECK_PASS"
          echo "DEPLOYED_COMMIT=$DEPLOY_SHA"
          REMOTE
