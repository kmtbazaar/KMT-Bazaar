name: Product size and pack UI checks

on:
  push:
    branches:
      - customer-live
    paths:
      - "frontend/app/vendor/products.tsx"
      - "frontend/app/vendor/store/**"
      - "frontend/app/product/**"
      - "frontend/src/productCategoryConfig.ts"
      - "backend/server.py"
      - "frontend/app/vendor/orders.tsx"
      - "frontend/app/orders/[id].tsx"
      - "frontend/app/admin/order/[id].tsx"
      - "frontend/src/components/ProductCard.tsx"
      - "frontend/scripts/validate-product-grid-layout.js"
      - ".github/workflows/product-size-pack-checks.yml"

permissions:
  contents: read

jobs:
  size-pack-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify size and pack buttons are saved and shown to customers
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");

          const vendor = fs.readFileSync("app/vendor/store/[id].tsx", "utf8");
          const vendorProducts = fs.readFileSync("app/vendor/products.tsx", "utf8");
          const imageUploader = fs.readFileSync("src/components/ProductImagesUploader.tsx", "utf8");
          const api = fs.readFileSync("src/api.ts", "utf8");
          const customer = fs.readFileSync("app/product/[id].tsx", "utf8");
          const productCard = fs.readFileSync("src/components/ProductCard.tsx", "utf8");
          const vendorOrders = fs.readFileSync("app/vendor/orders.tsx", "utf8");
          const vendorDashboard = fs.readFileSync("app/vendor/index.tsx", "utf8");
          const customerOrder = fs.readFileSync("app/orders/[id].tsx", "utf8");
          const adminOrder = fs.readFileSync("app/admin/order/[id].tsx", "utf8");
          const config = fs.readFileSync("src/productCategoryConfig.ts", "utf8");
          const adminVendor = fs.readFileSync("src/components/AdminVendorProducts.tsx", "utf8");
          const backend = fs.readFileSync("../backend/server.py", "utf8");

          assert.ok(vendor.includes("categoryConfig.variantOptions.map") && !vendor.includes("PRODUCT_UNIT_OPTIONS"), "Vendor must use category-specific variant options, not a universal size list.");
          const vendorCategoryIndex = vendorProducts.indexOf("vendor-product-category-picker");
          const vendorSizeIndex = vendorProducts.indexOf("vendor-product-size-pack-picker");
          assert.ok(vendorProducts.includes("getProductCategoryConfig(selectedCategory, form.name)") && vendorProducts.includes("unitOptions.map") && vendorProducts.includes("categoryConfig.variantOptions.length ? categoryConfig.variantOptions : PRODUCT_UNIT_OPTIONS") && vendorCategoryIndex >= 0 && vendorSizeIndex > vendorCategoryIndex && vendorProducts.includes("Choose {unitLabel}"), "Legacy Vendor Products screen must place category selection before and derive size choices from the selected category and product name, including Jeans waist sizes.");
          assert.ok(vendor.includes("vendor-store-add-variant-size-") && vendor.includes("Choose {categoryConfig.variantLabel}"), "Each Add Size row must show selectable category-specific options such as RAM / Storage for mobile products.");
          assert.ok(vendor.includes("PRODUCT_COLOR_OPTIONS.map((color) => color.label)") && vendor.includes("variant.colors ?? form.colors"), "Each added size row must show a selectable colour palette and retain its chosen colours.");
          assert.ok(vendor.includes("guideAddFormToField") && vendor.includes("addProductScrollRef.current?.scrollTo") && vendor.includes("addValidationError"), "Missing required fields must guide the vendor to the relevant Add Product section.");
          assert.ok(imageUploader.includes("allowsMultipleSelection: true") && imageUploader.includes("selectionLimit: remainingSlots") && imageUploader.includes("selectedAssets.length < requiredBatchCount"), "Product gallery must support one batch selection, enforce the minimum count, and cap the remaining slots.");
          assert.ok(imageUploader.includes("MAX_PRODUCT_SOURCE_BYTES = 10 * 1024 * 1024") && imageUploader.includes("MAX_WEB_PRODUCT_UPLOAD_BYTES = 240 * 1024") && imageUploader.includes("candidate.size <= MAX_WEB_PRODUCT_UPLOAD_BYTES") && imageUploader.includes("fileSize: asset.fileSize"), "Product uploader must accept originals up to 10 MB and compress browser uploads below 240 KB.");
          assert.ok(api.includes("MAX_PRODUCT_IMAGE_SOURCE_BYTES = 10 * 1024 * 1024") && api.includes("MAX_PRODUCT_IMAGE_UPLOAD_BYTES = 250 * 1024") && api.includes("webFile?.size || 0) > MAX_PRODUCT_IMAGE_UPLOAD_BYTES"), "API must enforce the 10 MB original and 250 KB compressed product photo limits.");
          assert.ok(backend.includes("MAX_UPLOAD_BYTES = 10 * 1024 * 1024") && backend.includes("PRODUCT_IMAGE_MAX_BYTES = 240 * 1024"), "Backend must accept 10 MB input files and store product images at or below 240 KB.");
          assert.ok(imageUploader.includes("allowMultipleSelection = false") && vendor.includes("allowMultipleSelection"), "Batch photo selection must be opt-in for Vendor Store and remain disabled for Admin by default.");
          assert.ok(adminVendor.includes("categoryConfig.variantOptions.map") && !adminVendor.includes("PRODUCT_UNIT_OPTIONS"), "Admin Vendor editor must use category-specific variant options.");
          assert.ok(config.includes('variant_label: "RAM / Storage"') && config.includes('variant_options: ["4 GB / 64 GB"') && config.includes('variant_label: isJeansProduct ? "Waist size (inches)" : "Clothing size"') && config.includes('["28", "30", "32", "34", "36", "38", "40", "42", "44", "46", "48", "50", "52"]') && config.includes('variant_label: "Shoe size (UK)"'), "Mobile, Jeans/Fashion and footwear must have dedicated option systems.");
          assert.ok(vendor.includes("vendor-store-add-product-size-pack-picker"), "Store vendor Add Product screen must render the size/pack picker.");
          assert.ok(vendor.includes('setForm((current) => ({ ...current, unit: option }));') && vendor.includes('clearAddValidationError("baseSize")'), "Selecting a RAM / Storage option must update the product unit and clear its validation error.");
          assert.ok(vendor.includes("vendor-store-edit-product-size-pack-picker"), "Store vendor Edit Product screen must render the size/pack picker.");
          assert.ok(vendor.includes("onPress={() => setEditProductForm((current) => ({ ...current, unit: option }))}"), "Selecting a chip in Edit Product must update the unit.");
          assert.ok(vendor.includes("vendor-store-add-product-item-category-picker"), "Add Product must render the distinct item-category box.");
          assert.ok(vendor.indexOf('testID="vendor-store-add-product-item-category-picker"') < vendor.indexOf('testID="vendor-store-add-product-size-pack-picker"'), "Add Product item category picker must appear above the clothing size/pack picker.");
          assert.ok(vendor.includes("vendor-store-edit-product-item-category-picker"), "Edit Product must render the distinct item-category box.");
          assert.ok(vendorOrders.includes('testID={`vendor-order-open-${item.id}`}') && vendorOrders.includes("onPress={() => setSelectedOrder(item)}"), "Tapping a vendor order card must open its full order details.");
          assert.ok(vendorOrders.includes('testID="vendor-order-detail-modal"') && vendorOrders.includes("Pickup / delivery address") && vendorOrders.includes("Payment and bill") && vendorOrders.includes("getOrderAddress(order.address)"), "Vendor order detail must show customer address and payment/bill details.");
          assert.ok(vendorOrders.includes("optionDetails") && vendorOrders.includes("it.color") && vendorOrders.includes("it.unit") && vendorOrders.includes("Quantity:"), "Vendor order detail must show each product's size, colour and quantity.");
          assert.ok(vendorDashboard.includes("item.unit") && vendorDashboard.includes("item.color") && vendorDashboard.includes("item.variant") && vendorDashboard.includes("Qty \${item.quantity || item.qty || 1}"), "Dashboard pending-order details must show the exact product size, colour and quantity.");
          assert.ok(!vendor.includes("vendor-store-add-new-item-category-name") && !vendor.includes("vendor-store-add-new-item-category"), "Add Product must only select existing dashboard-managed item categories, with no inline create row.");
          assert.ok(vendor.includes("saveStoreItemCategory") && vendor.includes("await load();") && vendor.includes("vendor-store-add-product-item-category-picker"), "Dashboard-managed item categories must refresh and appear in the Add Product picker.");
          assert.ok(vendor.includes("vendor-store-edit-new-item-category-name"), "Edit Product may retain its existing inline item-category option.");
          assert.ok(vendor.includes("vendor-store-edit-new-item-category"), "Edit Product must include a create-category button.");
          assert.ok(vendor.includes("createItemCategoryForProduct"), "Creating a category from the product form must be supported.");
          assert.ok(vendor.includes('testID="vendor-store-add-product-name"') && vendor.includes('testID="vendor-store-edit-product-name"'), "Full product name fields must exist in Add/Edit forms.");
          assert.ok(vendor.includes("productNameInput") && vendor.includes("multiline"), "Long product names must be viewable in the name field.");
          assert.ok(vendor.includes("vendor-store-add-product-shop-category") && vendor.includes("vendor-store-edit-product-shop-category"), "Shop category must remain in the top-right header.");
          assert.ok(vendor.includes('backgroundColor: "#ECFDF5"'), "Item category panel must retain its distinct color.");

          assert.ok(vendor.includes("...form,") && vendor.includes("...(variants ? { variants } : {})"), "Product payload must send the selected category variant list when enabled.");
          assert.ok(vendor.includes("vendor-store-add-product-variants") && vendor.includes("vendor-store-edit-product-variants"), "Vendor Add/Edit forms must support multiple size/pack rows.");
          assert.ok(vendor.includes("validateVariantDrafts") && vendor.includes("variants.length > 1"), "Vendor variant prices, stock, duplicate labels and multi-option descriptions must be validated.");
          assert.ok(vendor.includes("findDuplicateVariantSizeColorIndex") && vendor.includes("previousColors.has(color)") && vendor.includes("choose different colours for each option"), "The same RAM / Storage option must be accepted for separate, non-overlapping colour groups and rejected when colours overlap.");
          assert.ok(customer.includes("variantChoiceColors") && customer.includes("colorGroupLabel"), "Customers must be able to distinguish repeated RAM / Storage options by their colour groups.");
          assert.ok(backend.includes("seen_unit_colors") && backend.includes("color_keys == previous_colors") && backend.includes("can repeat only with a different colour group"), "Backend must allow repeated sizes only when their colour groups differ and reject duplicate groups.");
          assert.ok(!vendor.includes("categoryConfig.productAttributes.map") && !vendor.includes("vendor-store-add-product-attributes") && !vendor.includes("vendor-store-edit-product-attributes") && adminVendor.includes("categoryConfig.productAttributes.map"), "Store vendor Add/Edit forms must hide category-specific specifications while the Admin editor retains them.");
          assert.ok(vendor.includes("color_images: categoryConfig.showColors ? form.color_images : {}") && adminVendor.includes("form.color_images"), "Both product editors must save colour-specific galleries.");
          assert.ok(customer.includes('testID="product-size-pack-selector"'), "Customer product details must render the size/pack selector.");
          assert.ok(customer.includes("categoryConfig.showDescription") && customer.includes("p?.description") && customer.includes('testID="product-description"'), "Customer product detail must display saved product descriptions.");
          assert.ok(customer.includes('testID="product-category-attributes"') && customer.includes("categoryConfig.productAttributes") && customer.includes("p?.attributes"), "Customer product detail must display category-specific specifications.");
          assert.ok(customer.includes('suggestionCard: { width: "100%", height: 196') && customer.includes('suggestionImageWrap: { width: "100%", height: 106'), "You may also like product cards must have increased height and image area.");
          assert.ok(customer.includes("suggestionsGrid: { paddingHorizontal: SPACING.md, rowGap: 12 }") && customer.includes('suggestionGridRow: { flexDirection: "row", columnGap: 10'), "You may also like cards must have clear vertical and horizontal gaps.");
          assert.ok(customer.includes("selectedVariant?.price") && customer.includes("selectedVariant?.stock"), "Selected variant price and stock must drive customer detail.");
          assert.ok(customer.includes("await add(p.id, 1, selectedVariant?.id, selectedColor)"), "Customer Add to Cart must send the selected size and colour.");
          assert.ok(customer.includes("selectedPrice"), "Customer price and bottom cart CTA must reflect the selected variant.");
          assert.ok(customer.includes('testID="product-selected-variant-description"') && customer.includes("selectedVariant?.description") && customer.includes("Product specifications"), "Customer detail must render selected-variant descriptions and category specifications.");
          assert.ok(vendor.includes("Description for this option") && !vendor.includes("Description for the first option"), "Only added size options may have a description field.");
          assert.ok(vendor.includes("vendor-store-add-variant-colours-") && vendor.includes("vendor-store-edit-variant-colours-") && vendor.includes("variant.colors"), "Each added size option must support its own colour selection.");
          assert.ok(vendor.includes("color_images?: Record<string, string[]>") && vendor.includes("imagesByColor={variant.color_images || {}}") && vendor.includes("Upload photos for each selected colour") && !vendor.includes("validateVariantColorImages"), "Every new size colour has an optional gallery and missing size photos do not block product creation.");
          assert.ok(backend.includes("Each size/pack option owns its colour palette"), "Backend must allow each size to maintain an independent colour palette.");
          assert.ok(vendor.includes("const selectedOptionColors = Array.from(new Map(") && !vendor.includes("colors: Array.from(new Map([...current.colors, ...colors]"), "Add Size colours must not modify the base product colour list.");
          assert.ok(backend.includes("class ProductVariantIn(BaseModel):") && backend.includes("variant_color_images = _normalize_product_color_images") && backend.includes('normalized_variant["color_images"]'), "Backend must accept and persist colour photos for each size.");
          assert.ok(customer.includes("selectedVariant?.color_images") && customer.includes("selectedVariantColorImages") && customer.includes("variantImages.length ? variantImages : productImagesForColor"), "Customer gallery and colour previews must use selected-size colour photos first.");
          assert.ok(customer.includes("selectedVariantColors") && customer.includes("selectedVariantColors.map"), "Customer colour choices must follow the selected size/pack option.");
          assert.ok(backend.includes("colors: Optional[List[str]] = None") && backend.includes("_validate_product_variant_colors"), "Backend must persist and validate per-variant colours.");
          assert.ok(vendor.includes('testID="vendor-store-add-product-colours"') && vendor.includes('testID="vendor-store-edit-product-colours"'), "Vendor Add/Edit forms must save product colour options.");
          assert.ok(customer.includes('testID="product-colour-selector"') && customer.includes("setSelectedColor"), "Customer must be able to choose a product colour.");
          assert.ok(!customer.includes("variantChoicePriceRow"), "Customer size buttons must show the size label only, not a price.");
          assert.ok(customer.includes('testID="product-image-viewer"') && customer.includes("Gesture.Pinch()") && customer.includes("Gesture.Pan()"), "Customer product photos must open in a pinch-zoom viewer.");
          assert.ok(vendorOrders.includes("it.color") && vendorOrders.includes("it.variant") && vendorOrders.includes('key={`${it.product_id}:'), "Vendor orders must identify and display each ordered colour.");
          assert.ok(customerOrder.includes("it.color") && adminOrder.includes("it.color"), "Customer and admin order details must display the selected colour.");
          assert.ok(customer.includes('width: "22%"') && customer.includes('maxWidth: "24%"'), "Four size/pack options should fit across without overlap.");
          assert.ok(productCard.includes('fontSize: 11,\n    fontWeight: "700"'), "Product unit label must be larger and bolder.");
          assert.ok(productCard.includes("minWidth: 48,\n    height: 34,"), "Add button should be taller with a usable minimum width.");

          console.log("PRODUCT_SIZE_PACK_UI_VALIDATION_PASS");
          console.log("Validated category-specific options, variant prices/descriptions/stock, and customer selector/cart wiring.");
          NODE
      - name: Lint changed product UI files
        run: npx eslint "app/vendor/store/[id].tsx" "app/vendor/products.tsx" "app/product/[id].tsx" "src/components/ProductCard.tsx" --no-cache
      - name: Build web app
        run: npm run build:web
