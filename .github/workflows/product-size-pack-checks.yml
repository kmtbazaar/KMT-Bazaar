name: Product size and pack UI checks

on:
  push:
    branches:
      - customer-live
    paths:
      - "frontend/app/vendor/products.tsx"
      - "frontend/app/vendor/store/**"
      - "frontend/app/product/[id].tsx"
      - ".github/workflows/product-size-pack-checks.yml"

permissions:
  contents: read

jobs:
  size-pack-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify size and pack buttons are saved and shown to customers
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");

          const vendor = fs.readFileSync("app/vendor/store/[id].tsx", "utf8");
          const customer = fs.readFileSync("app/product/[id].tsx", "utf8");

          const options = [
            "XS", "S", "M", "L", "XL", "XXL",
            "1 pc", "250 g", "500 g", "1 kg",
            "250 ml", "500 ml", "750 ml", "1 L", "2 L"
          ];

          assert.ok(vendor.includes("const PRODUCT_UNIT_OPTIONS = ["), "Vendor size/pack options are missing.");
          for (const option of options) {
            assert.ok(vendor.includes(JSON.stringify(option)), `Missing vendor option: ${option}`);
          }
          assert.ok(vendor.includes("vendor-store-add-product-size-pack-picker"), "Store vendor Add Product screen must render the size/pack picker.");
          assert.ok(vendor.includes("onPress={() => setForm((current) => ({ ...current, unit: option }))}"), "Selecting a chip in Add Product must update the unit.");
          assert.ok(vendor.includes("vendor-store-edit-product-size-pack-picker"), "Store vendor Edit Product screen must render the size/pack picker.");
          assert.ok(vendor.includes("onPress={() => setEditProductForm((current) => ({ ...current, unit: option }))}"), "Selecting a chip in Edit Product must update the unit.");
          assert.ok(vendor.includes("vendor-store-add-product-item-category-picker"), "Add Product must render the distinct item-category box.");
          assert.ok(vendor.includes("vendor-store-edit-product-item-category-picker"), "Edit Product must render the distinct item-category box.");
          assert.ok(vendor.includes("vendor-store-add-new-item-category-name"), "Add Product must include a new item-category name field.");
          assert.ok(vendor.includes("vendor-store-add-new-item-category"), "Add Product must include a create-category button.");
          assert.ok(vendor.includes("vendor-store-edit-new-item-category-name"), "Edit Product must include a new item-category name field.");
          assert.ok(vendor.includes("vendor-store-edit-new-item-category"), "Edit Product must include a create-category button.");
          assert.ok(vendor.includes("createItemCategoryForProduct"), "Creating a category from the product form must be supported.");
          assert.ok(vendor.includes('testID="vendor-store-add-product-name"') && vendor.includes('testID="vendor-store-edit-product-name"'), "Full product name fields must exist in Add/Edit forms.");
          assert.ok(vendor.includes("productNameInput") && vendor.includes("multiline"), "Long product names must be viewable in the name field.");
          assert.ok(vendor.includes("vendor-store-add-product-shop-category") && vendor.includes("vendor-store-edit-product-shop-category"), "Shop category must remain in the top-right header.");
          assert.ok(vendor.includes('backgroundColor: "#ECFDF5"'), "Item category panel must retain its distinct color.");

          assert.ok(vendor.includes("...form,") && vendor.includes("variants,"), "Product payload must send the selected size/pack variant list.");
          assert.ok(vendor.includes("vendor-store-add-product-variants") && vendor.includes("vendor-store-edit-product-variants"), "Vendor Add/Edit forms must support multiple size/pack rows.");
          assert.ok(vendor.includes("validateVariantDrafts"), "Vendor variant prices, stock, and duplicate labels must be validated.");
          assert.ok(customer.includes('testID="product-size-pack-selector"'), "Customer product details must render the size/pack selector.");
          assert.ok(customer.includes("selectedVariant?.price") && customer.includes("selectedVariant?.stock"), "Selected variant price and stock must drive customer detail.");
          assert.ok(customer.includes("await add(p.id, 1, selectedVariant?.id)"), "Customer Add to Cart must send the selected variant ID.");
          assert.ok(customer.includes("selectedPrice"), "Customer price and bottom cart CTA must reflect the selected variant.");

          console.log("PRODUCT_SIZE_PACK_UI_VALIDATION_PASS");
          console.log(`Validated ${options.length} unit options, variant prices/stock, and customer selector/cart wiring.`);
          NODE
      - name: Lint changed product UI files
        run: npx eslint "app/vendor/store/[id].tsx" "app/vendor/products.tsx" "app/product/[id].tsx" --no-cache
      - name: Build web app
        run: npm run build:web
