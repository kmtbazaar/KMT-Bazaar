          const register = fs.readFileSync("app/auth/register.tsx", "utf8");
          const serviceRoute = fs.readFileSync("app/service/[type].tsx", "utf8");
          const adminBookings = fs.readFileSync("app/admin/service-bookings.tsx", "utf8");
          const vendorBookings = fs.readFileSync("app/vendor/service-bookings.tsx", "utf8");
          const adminVendors = fs.readFileSync("app/admin/service-vendors.tsx", "utf8");
          const backend = fs.readFileSync("../backend/server.py", "utf8");
          assert.ok(home.includes('title: "Events"') && register.includes('label: "Events"') && serviceRoute.includes('premium_decorator: { title: "Events"') && adminBookings.includes('premium_decorator:{label:"Events"') && adminVendors.includes('premium_decorator:"Events"'), "Premium Decorator must be labelled Events throughout customer, registration and admin service screens.");
