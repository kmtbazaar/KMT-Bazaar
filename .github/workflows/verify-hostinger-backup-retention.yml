name: Verify Hostinger backup retention

on:
  push:
    branches:
      - customer-live
    paths:
      - ".github/workflows/verify-hostinger-backup-retention.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        id: ssh
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail
          PORT="${HOSTINGER_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" > "$HOME/.ssh/kmt_bazaar_verify_key"
          chmod 600 "$HOME/.ssh/kmt_bazaar_verify_key"
          ssh-keyscan -p "$PORT" -H "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Verify live site, API connections, one backup, and disk
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          DEST="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          ssh -T -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$HOME/.ssh/kmt_bazaar_verify_key" -p "$HOSTINGER_PORT" "$DEST" "bash -s" <<'REMOTE'
          set -Eeuo pipefail
          WEBROOT=/var/www/kmt-bazaar-com
          mapfile -d '' BACKUPS < <(find /var/www -mindepth 1 -maxdepth 1 -type d \( -name 'kmt-bazaar-com-backup-*' -o -name 'kmt-bazaar-backup-*' \) -print0)
          [ "${#BACKUPS[@]}" -eq 1 ]
          BACKUP="${BACKUPS[0]}"
          test -s "$WEBROOT/index.html"
          test -s "$BACKUP/index.html"
          nginx -t
          systemctl is-active --quiet nginx
          systemctl is-active --quiet kmt-bazaar-com.service
          NGINX_CONFIG="$(nginx -T 2>&1)"
          printf '%s\n' "$NGINX_CONFIG" | grep -Fq 'root /var/www/kmt-bazaar-com;'
          printf '%s\n' "$NGINX_CONFIG" | grep -Fq 'proxy_pass http://127.0.0.1:8001;'
          HOME_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve kmtbazaar.com:443:127.0.0.1 https://kmtbazaar.com/)
          STORES_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve kmtbazaar.com:443:127.0.0.1 https://kmtbazaar.com/api/stores)
          PRODUCTS_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve kmtbazaar.com:443:127.0.0.1 https://kmtbazaar.com/api/products)
          GOOGLE_CONFIG_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve kmtbazaar.com:443:127.0.0.1 https://kmtbazaar.com/api/auth/google/config)
          echo "BACKUP_COUNT=${#BACKUPS[@]}"
          echo "BACKUP_PATH=$BACKUP"
          du -sh "$BACKUP" "$WEBROOT"
          echo "NGINX=active"
          echo "BACKEND_SERVICE=active"
          echo "HOME=$HOME_CODE"
          echo "STORES=$STORES_CODE"
          echo "PRODUCTS=$PRODUCTS_CODE"
          echo "GOOGLE_CONFIG=$GOOGLE_CONFIG_CODE"
          df -h /
          [ "$HOME_CODE" = "200" ] && [ "$STORES_CODE" = "200" ] && [ "$PRODUCTS_CODE" = "200" ] && [ "$GOOGLE_CONFIG_CODE" = "200" ]
          REMOTE
