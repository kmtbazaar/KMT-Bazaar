name: Secure web auth checks

on:
  push:
    branches:
      - fix/secure-cookie-web-auth
      - customer-live
  pull_request:
    branches:
      - customer-live

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend source
        run: python -m py_compile backend/server.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate admin dashboard tile dimensions
        working-directory: frontend
        run: node scripts/validate-admin-dashboard-layout.js
      - name: Validate product grid sizing and category navigation
        working-directory: frontend
        run: node scripts/validate-product-grid-layout.js
      - name: Validate admin product customer visibility
        working-directory: frontend
        run: node scripts/validate-admin-product-visibility.js
      - name: Export web app
        working-directory: frontend
        run: npm run build:web
      - name: Smoke-check exported admin route and JavaScript asset
        working-directory: frontend
        run: node scripts/validate-admin-dashboard-layout.js --check-build
