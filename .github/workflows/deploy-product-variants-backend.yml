name: Deploy targeted KMT Bazaar backend patch to kmtbazaar.com

on:
  push:
    branches:
      - customer-live
    paths:
      - "backend/server.py"
      - ".github/workflows/deploy-product-variants-backend.yml"
  workflow_dispatch:
    inputs:
      confirm_live_deploy:
        description: "Confirm the targeted KMT Bazaar backend patch"
        required: true
        type: choice
        options:
          - "yes"

permissions:
  contents: read

concurrency:
  group: kmt-bazaar-com-backend-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    if: github.event_name != 'workflow_dispatch' || inputs.confirm_live_deploy == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: customer-live

      - name: Validate repository backend syntax and delivery PIN rule
        run: |
          python -m py_compile backend/server.py
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("backend/server.py").read_text(encoding="utf-8")
          assert 'PRODUCT_DELIVERY_STATE = "Jharkhand"' in source
          assert 'PRODUCT_DELIVERY_PINCODE = "815352"' in source
          assert "AUTH_SESSION_DAYS = 30" in source
          assert "JWT_EXPIRE_MIN = 60 * 24 * AUTH_SESSION_DAYS" in source
          assert "WEB_SESSION_TIMEOUT_MIN = 60 * 24 * AUTH_SESSION_DAYS" in source
          assert "AUTH_COOKIE_MAX_AGE = WEB_SESSION_TIMEOUT_MIN * 60" in source
          print("BACKEND_30_DAY_AUTH_DURATION_VALIDATION_PASS")
          assert "force_product_delivery_state" in source
          assert "return PRODUCT_DELIVERY_PINCODE" in source
          assert "delivery_pincode != PRODUCT_DELIVERY_PINCODE" in source
          assert '"state": PRODUCT_DELIVERY_STATE, "pincode": PRODUCT_DELIVERY_PINCODE' in source
          print("BACKEND_FIXED_STATE_PIN_VALIDATION_PASS")

          frontend_api = Path("frontend/src/api.ts").read_text(encoding="utf-8")
          auth_context = Path("frontend/src/AuthContext.tsx").read_text(encoding="utf-8")
          assert "export const AUTH_SESSION_DAYS = 30" in frontend_api
          assert "WEB_SESSION_TIMEOUT_MS = AUTH_SESSION_DAYS * 24 * 60 * 60 * 1000" in frontend_api
          assert "window.localStorage.getItem(WEB_TAB_ID_KEY)" in frontend_api
          assert "window.localStorage.setItem(WEB_TAB_ID_KEY, legacySessionId)" in frontend_api
          assert "api.refreshWebSession()" in auth_context
          assert "adopting the active server session" in auth_context
          for route_name in ("login", "verify_email_login_otp", "verify_email_signup_otp", "google_login", "verify_otp"):
              route_start = source.find("async def " + route_name + "(")
              assert route_start >= 0, f"Missing auth route: {route_name}"
              route_end = source.find("\n@api.", route_start + 1)
              if route_end < 0:
                  route_end = len(source)
              route_block = source[route_start:route_end]
              assert "build_auth_response" in route_block, f"{route_name} must issue the shared 30-day session"
          print("ALL_ROLE_30_DAY_SESSION_AND_PERSISTENT_BROWSER_SELECTOR_VALIDATION_PASS")
          PY

      - name: Check required Hostinger SSH configuration
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$HOSTINGER_HOST" ] || missing+=("HOSTINGER_HOST")
          [ -n "$HOSTINGER_USER" ] || missing+=("HOSTINGER_USER")
          [ -n "$HOSTINGER_SSH_KEY" ] || missing+=("HOSTINGER_SSH_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Configure SSH
        id: ssh
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail
          PORT="${HOSTINGER_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" > "$HOME/.ssh/kmt_bazaar_backend_key"
          chmod 600 "$HOME/.ssh/kmt_bazaar_backend_key"
          ssh-keyscan -p "$PORT" -H "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          printf 'port=%s\n' "$PORT" >> "$GITHUB_OUTPUT"

      - name: Apply targeted backend changes without replacing local server changes
        timeout-minutes: 5
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          DEST="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/kmt_bazaar_backend_key" -p "$HOSTINGER_PORT" "$DEST" \
            "DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          exec 9>/run/kmt-bazaar-com-backend-deploy.lock
          flock -n 9 || { echo "STOP: Another backend deployment is running."; exit 1; }

          TARGET=/root/KMT-Bazaar-com/backend/server.py
          test -s "$TARGET"
          BACKUP="/root/kmtbazaar-backend-backup-${DEPLOY_SHA:0:12}-$(date +%Y%m%d-%H%M%S).py"
          cp -a "$TARGET" "$BACKUP"

          rollback() {
            echo "BACKEND_ROLLBACK_START"
            cp -a "$BACKUP" "$TARGET"
            systemctl restart kmt-bazaar-com.service || true
            echo "BACKEND_BACKUP=$BACKUP"
          }

          if ! python3 - "$TARGET" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          original = source

          if "GOOGLE_CLIENT_ID =" not in source:
              raise SystemExit("STOP: Existing server.py has no GOOGLE_CLIENT_ID setting; no file changes made.")

          # Normalize this one setting only; all other local server changes stay intact.
          old_setting = 'GOOGLE_CLIENT_ID = os.getenv("GOOGLE_CLIENT_ID", "")'
          new_setting = 'GOOGLE_CLIENT_ID = (os.getenv("GOOGLE_CLIENT_ID") or "").strip()'
          setting_count = source.count(old_setting)
          if setting_count > 1:
              raise SystemExit("STOP: Multiple GOOGLE_CLIENT_ID declarations; no file changes made.")
          if setting_count == 1:
              source = source.replace(old_setting, new_setting, 1)

          route = '@api.get("/auth/google/config")'
          if route not in source:
              marker = '@api.post("/auth/google")'
              if source.count(marker) != 1:
                  raise SystemExit("STOP: Could not identify exactly one existing Google login route; no file changes made.")
              config_route = (
                  '@api.get("/auth/google/config")\n'
                  'async def google_auth_config(response: Response):\n'
                  '    # Share the public OAuth client ID used by the backend token verifier.\n'
                  '    response.headers["Cache-Control"] = "no-store"\n'
                  '    return {"configured": bool(GOOGLE_CLIENT_ID), "client_id": GOOGLE_CLIENT_ID or None}\n'
                  '\n\n'
              )
              source = source.replace(marker, config_route + marker, 1)

          # Keep all successful logins on the same 30-day native/browser session policy.
          newline = "\r\n" if "\r\n" in source else "\n"
          auth_days = re.compile(r"^AUTH_SESSION_DAYS\s*=.*$", re.M)
          auth_days_matches = list(auth_days.finditer(source))
          if len(auth_days_matches) > 1:
              raise SystemExit("STOP: Multiple AUTH_SESSION_DAYS settings; no VPS changes made.")
          if auth_days_matches:
              if auth_days_matches[0].group(0).strip() != "AUTH_SESSION_DAYS = 30":
                  raise SystemExit("STOP: Conflicting AUTH_SESSION_DAYS setting; no VPS changes made.")
          else:
              jwt_setting = re.compile(r"^JWT_EXPIRE_MIN\s*=.*$", re.M)
              if len(list(jwt_setting.finditer(source))) != 1:
                  raise SystemExit("STOP: Could not safely locate JWT_EXPIRE_MIN; no VPS changes made.")
              source = jwt_setting.sub("AUTH_SESSION_DAYS = 30" + newline + r"\g<0>", source, count=1)

          duration_settings = {
              "JWT_EXPIRE_MIN": "JWT_EXPIRE_MIN = 60 * 24 * AUTH_SESSION_DAYS",
              "WEB_SESSION_TIMEOUT_MIN": "WEB_SESSION_TIMEOUT_MIN = 60 * 24 * AUTH_SESSION_DAYS",
              "AUTH_COOKIE_MAX_AGE": "AUTH_COOKIE_MAX_AGE = WEB_SESSION_TIMEOUT_MIN * 60",
          }
          for setting_name, expected_line in duration_settings.items():
              setting_pattern = re.compile(rf"^\s*{re.escape(setting_name)}\s*=.*$", re.M)
              setting_matches = list(setting_pattern.finditer(source))
              if len(setting_matches) != 1:
                  raise SystemExit(f"STOP: Expected exactly one {setting_name} setting; no VPS changes made.")
              source = setting_pattern.sub(expected_line, source, count=1)

          # Safely add the canonical state/PIN constants without relying on exact newline formatting.
          lines = source.splitlines(keepends=True)
          pin_indexes = [i for i, line in enumerate(lines) if re.match(r"^\s*PRODUCT_DELIVERY_PINCODE\s*=", line)]
          if len(pin_indexes) > 1:
              raise SystemExit("STOP: Multiple product delivery PIN declarations; no VPS changes made.")
          if not pin_indexes:
              defaults = [i for i, line in enumerate(lines) if re.match(r"^\s*DEFAULT_HOLIDAY_BANNER_URL\s*=", line)]
              if len(defaults) != 1:
                  raise SystemExit("STOP: Could not safely locate backend constants; no VPS changes made.")
              lines.insert(defaults[0] + 1, 'PRODUCT_DELIVERY_PINCODE = "815352"' + newline)
              pin_indexes = [defaults[0] + 1]
          pin_line = lines[pin_indexes[0]].strip()
          if pin_line != 'PRODUCT_DELIVERY_PINCODE = "815352"':
              raise SystemExit("STOP: Conflicting product delivery PIN setting; no VPS changes made.")

          state_indexes = [i for i, line in enumerate(lines) if re.match(r"^\s*PRODUCT_DELIVERY_STATE\s*=", line)]
          if len(state_indexes) > 1:
              raise SystemExit("STOP: Multiple product delivery state declarations; no VPS changes made.")
          if state_indexes:
              if lines[state_indexes[0]].strip() != 'PRODUCT_DELIVERY_STATE = "Jharkhand"':
                  raise SystemExit("STOP: Conflicting product delivery state setting; no VPS changes made.")
          else:
              pin_indexes = [i for i, line in enumerate(lines) if re.match(r"^\s*PRODUCT_DELIVERY_PINCODE\s*=", line)]
              lines.insert(pin_indexes[0] + 1, 'PRODUCT_DELIVERY_STATE = "Jharkhand"' + newline)
          source = "".join(lines)

          # Force API-created and edited addresses to the fixed state and PIN.
          if "force_product_delivery_state" not in source:
              address_class = source.find("class AddressIn(")
              pin_validator = source.find('    @field_validator("pincode")', address_class)
              validator_end = source.find("\n\nclass CartItemIn", pin_validator)
              if address_class < 0 or pin_validator < 0 or validator_end < 0:
                  raise SystemExit("STOP: Could not safely locate AddressIn validators; no VPS changes made.")
              new_validator = newline.join([
                  '    @field_validator("state")',
                  '    @classmethod',
                  '    def force_product_delivery_state(cls, value):',
                  '        return PRODUCT_DELIVERY_STATE',
                  '',
                  '    @field_validator("pincode")',
                  '    @classmethod',
                  '    def validate_address_pincode(cls, value):',
                  '        return PRODUCT_DELIVERY_PINCODE',
              ])
              source = source[:pin_validator] + new_validator + source[validator_end:]

          # Update older saved addresses when customers load their address list.
          list_matches = [m.start() for m in re.finditer(r"^async def list_addresses\(", source, re.M)]
          if len(list_matches) != 1:
              raise SystemExit("STOP: Could not uniquely locate address-list route; no VPS changes made.")
          list_start = list_matches[0]
          list_body_start = source.find(newline, list_start) + len(newline)
          next_route = source.find(newline + newline + "@api.", list_body_start)
          list_end = next_route if next_route >= 0 else len(source)
          list_body = source[list_body_start:list_end]
          if "PRODUCT_DELIVERY_STATE" not in list_body or "PRODUCT_DELIVERY_PINCODE" not in list_body:
              migration = newline.join([
                  '    await db.addresses.update_many(',
                  '        {',
                  '            "user_id": current["id"],',
                  '            "$or": [',
                  '                {"state": {"$ne": PRODUCT_DELIVERY_STATE}},',
                  '                {"pincode": {"$ne": PRODUCT_DELIVERY_PINCODE}},',
                  '            ],',
                  '        },',
                  '        {"$set": {"state": PRODUCT_DELIVERY_STATE, "pincode": PRODUCT_DELIVERY_PINCODE}},',
                  '    )',
              ]) + newline
              source = source[:list_body_start] + migration + source[list_body_start:]

          if "delivery_pincode != PRODUCT_DELIVERY_PINCODE" not in source:
              address_anchor = (
                  '    addr = await db.addresses.find_one(\n'
                  '        {"id": data.address_id, "user_id": current["id"]},\n'
                  '        {"_id": 0}\n'
                  '    )\n'
                  '    if not addr:\n'
                  '        raise HTTPException(400, "Invalid address")\n'
              )
              if source.count(address_anchor) != 1:
                  raise SystemExit("STOP: Could not safely locate product checkout address validation; no VPS changes made.")
              guard = (
                  address_anchor
                  + '\n'
                  + '    delivery_pincode = re.sub(r"\\D", "", str(addr.get("pincode") or ""))\n'
                  + '    if delivery_pincode != PRODUCT_DELIVERY_PINCODE:\n'
                  + '        raise HTTPException(\n'
                  + '            status_code=400,\n'
                  + '            detail=(\n'
                  + '                f"Service not available at PIN code {delivery_pincode}. "\n'
                  + '                f"Products are currently deliverable only to PIN code {PRODUCT_DELIVERY_PINCODE}."\n'
                  + '            ),\n'
                  + '        )\n'
              )
              source = source.replace(address_anchor, guard, 1)

          if 'update_data.pop("latitude", None)' not in source:
              old_update = '    res = await db.addresses.update_one({"id": addr_id, "user_id": current["id"]}, {"$set": data.dict()})'
              if source.count(old_update) != 1:
                  raise SystemExit("STOP: Could not safely locate address update handler; no VPS changes made.")
              new_update = (
                  '    update_data = data.dict()\n'
                  '    if data.latitude is None and data.longitude is None:\n'
                  '        # Address edits that only change postal details must retain saved GPS coordinates.\n'
                  '        update_data.pop("latitude", None)\n'
                  '        update_data.pop("longitude", None)\n'
                  '    res = await db.addresses.update_one({"id": addr_id, "user_id": current["id"]}, {"$set": update_data})'
              )
              source = source.replace(old_update, new_update, 1)

          if source != original:
              mode = path.stat().st_mode & 0o777
              temporary = path.with_suffix(path.suffix + ".targeted-backend.tmp")
              temporary.write_text(source, encoding="utf-8")
              os.chmod(temporary, mode)
              os.replace(temporary, path)
              print("KMT_BACKEND_TARGETED_PATCH_APPLIED")
          else:
              print("KMT_BACKEND_PATCH_ALREADY_PRESENT")
          PY
          then
            echo "STOP: Backend source did not match the expected targeted patch structure."
            exit 1
          fi

          if ! grep -Fq 'delivery_pincode != PRODUCT_DELIVERY_PINCODE' "$TARGET" \
            || ! grep -Fq 'PRODUCT_DELIVERY_STATE = "Jharkhand"' "$TARGET" \
            || ! grep -Fq 'force_product_delivery_state' "$TARGET" \
            || ! grep -Fq 'return PRODUCT_DELIVERY_PINCODE' "$TARGET" \
            || ! grep -Fq 'await db.addresses.update_many(' "$TARGET"; then
            echo "BACKEND_FIXED_STATE_PIN_PATCH_MISSING"
            rollback
            exit 1
          fi

          if ! grep -Fq 'AUTH_SESSION_DAYS = 30' "$TARGET" \
            || ! grep -Fq 'JWT_EXPIRE_MIN = 60 * 24 * AUTH_SESSION_DAYS' "$TARGET" \
            || ! grep -Fq 'WEB_SESSION_TIMEOUT_MIN = 60 * 24 * AUTH_SESSION_DAYS' "$TARGET" \
            || ! grep -Fq 'AUTH_COOKIE_MAX_AGE = WEB_SESSION_TIMEOUT_MIN * 60' "$TARGET"; then
            echo "BACKEND_30_DAY_AUTH_SESSION_PATCH_MISSING"
            rollback
            exit 1
          fi

          if ! python3 -m py_compile "$TARGET"; then
            echo "BACKEND_SYNTAX_FAIL"
            rollback
            exit 1
          fi

          if ! systemctl restart kmt-bazaar-com.service; then
            rollback
            exit 1
          fi

          READY=0
          for ATTEMPT in $(seq 1 12); do
            if systemctl is-active --quiet kmt-bazaar-com.service \
              && curl -fsS --max-time 10 http://127.0.0.1:8001/api/products >/dev/null 2>&1; then
              READY=1
              break
            fi
            echo "BACKEND_STARTUP_WAIT attempt=$ATTEMPT"
            sleep 5
          done

          if [ "$READY" -ne 1 ]; then
            echo "BACKEND_HEALTH_CHECK_FAIL"
            systemctl status kmt-bazaar-com.service --no-pager || true
            journalctl -u kmt-bazaar-com.service -n 80 --no-pager || true
            rollback
            exit 1
          fi

          if ! GOOGLE_CONFIG="$(curl -fsS --max-time 10 http://127.0.0.1:8001/api/auth/google/config)"; then
            echo "GOOGLE_CONFIG_ENDPOINT_FAIL"
            rollback
            exit 1
          fi
          if ! printf '%s' "$GOOGLE_CONFIG" | python3 -c 'import json,sys; d=json.load(sys.stdin); ok=bool(d.get("configured") and d.get("client_id")); print("GOOGLE_CONFIGURED="+("YES" if ok else "NO")); sys.exit(0 if ok else 1)'; then
            echo "GOOGLE_OAUTH_CLIENT_ID_NOT_CONFIGURED"
            rollback
            exit 1
          fi

          echo "BACKEND_HEALTH_CHECK_PASS"
          echo "BACKEND_BACKUP=$BACKUP"
          echo "DEPLOYED_COMMIT=$DEPLOY_SHA"
          REMOTE
