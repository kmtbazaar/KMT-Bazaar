name: Safely patch Google sign-in configuration on kmtbazaar.com

on:
  push:
    branches:
      - customer-live
    paths:
      - "backend/server.py"
      - ".github/workflows/deploy-product-variants-backend.yml"
  workflow_dispatch:
    inputs:
      confirm_live_deploy:
        description: "Confirm the targeted Google sign-in backend patch"
        required: true
        type: choice
        options:
          - "yes"

permissions:
  contents: read

concurrency:
  group: kmt-bazaar-com-backend-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    if: github.event_name != 'workflow_dispatch' || inputs.confirm_live_deploy == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: customer-live

      - name: Validate repository backend syntax
        run: python -m py_compile backend/server.py

      - name: Check required Hostinger SSH configuration
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$HOSTINGER_HOST" ] || missing+=("HOSTINGER_HOST")
          [ -n "$HOSTINGER_USER" ] || missing+=("HOSTINGER_USER")
          [ -n "$HOSTINGER_SSH_KEY" ] || missing+=("HOSTINGER_SSH_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Configure SSH
        id: ssh
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail
          PORT="${HOSTINGER_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" > "$HOME/.ssh/kmt_bazaar_backend_key"
          chmod 600 "$HOME/.ssh/kmt_bazaar_backend_key"
          ssh-keyscan -p "$PORT" -H "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          printf 'port=%s\n' "$PORT" >> "$GITHUB_OUTPUT"

      - name: Apply the targeted Google OAuth patch without replacing local server changes
        timeout-minutes: 5
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          DEST="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$HOME/.ssh/kmt_bazaar_backend_key" -p "$HOSTINGER_PORT" "$DEST" \
            "DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          exec 9>/run/kmt-bazaar-google-auth-deploy.lock
          flock -n 9 || { echo "STOP: Another backend deployment is running."; exit 1; }

          TARGET=/root/KMT-Bazaar-com/backend/server.py
          test -s "$TARGET"
          BACKUP="/root/kmtbazaar-google-auth-backup-${DEPLOY_SHA:0:12}-$(date +%Y%m%d-%H%M%S).py"
          cp -a "$TARGET" "$BACKUP"

          rollback() {
            echo "BACKEND_ROLLBACK_START"
            cp -a "$BACKUP" "$TARGET"
            systemctl restart kmt-bazaar-com.service || true
            echo "BACKEND_BACKUP=$BACKUP"
          }

          if ! python3 - "$TARGET" <<'PY'
          import os
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          original = source

          if "GOOGLE_CLIENT_ID =" not in source:
              raise SystemExit("STOP: Existing server.py has no GOOGLE_CLIENT_ID setting; no file changes made.")

          # Normalize this one setting only; all other local server changes stay intact.
          old_setting = 'GOOGLE_CLIENT_ID = os.getenv("GOOGLE_CLIENT_ID", "")'
          new_setting = 'GOOGLE_CLIENT_ID = (os.getenv("GOOGLE_CLIENT_ID") or "").strip()'
          setting_count = source.count(old_setting)
          if setting_count > 1:
              raise SystemExit("STOP: Multiple GOOGLE_CLIENT_ID declarations; no file changes made.")
          if setting_count == 1:
              source = source.replace(old_setting, new_setting, 1)

          route = '@api.get("/auth/google/config")'
          if route not in source:
              marker = '@api.post("/auth/google")'
              if source.count(marker) != 1:
                  raise SystemExit("STOP: Could not identify exactly one existing Google login route; no file changes made.")
              config_route = (
                  '@api.get("/auth/google/config")\n'
                  'async def google_auth_config(response: Response):\n'
                  '    # Share the public OAuth client ID used by the backend token verifier.\n'
                  '    response.headers["Cache-Control"] = "no-store"\n'
                  '    return {"configured": bool(GOOGLE_CLIENT_ID), "client_id": GOOGLE_CLIENT_ID or None}\n'
                  '\n\n'
              )
              source = source.replace(marker, config_route + marker, 1)

          if source != original:
              mode = path.stat().st_mode & 0o777
              temporary = path.with_suffix(path.suffix + ".google-auth.tmp")
              temporary.write_text(source, encoding="utf-8")
              os.chmod(temporary, mode)
              os.replace(temporary, path)
              print("GOOGLE_AUTH_TARGETED_PATCH_APPLIED")
          else:
              print("GOOGLE_AUTH_PATCH_ALREADY_PRESENT")
          PY
          then
            echo "STOP: Backend source did not match the expected Google OAuth structure."
            exit 1
          fi

          if ! python3 -m py_compile "$TARGET"; then
            echo "BACKEND_SYNTAX_FAIL"
            rollback
            exit 1
          fi

          if ! systemctl restart kmt-bazaar-com.service; then
            rollback
            exit 1
          fi

          READY=0
          for ATTEMPT in $(seq 1 12); do
            if systemctl is-active --quiet kmt-bazaar-com.service \
              && curl -fsS --max-time 10 http://127.0.0.1:8001/api/products >/dev/null 2>&1; then
              READY=1
              break
            fi
            echo "BACKEND_STARTUP_WAIT attempt=$ATTEMPT"
            sleep 5
          done

          if [ "$READY" -ne 1 ]; then
            echo "BACKEND_HEALTH_CHECK_FAIL"
            systemctl status kmt-bazaar-com.service --no-pager || true
            journalctl -u kmt-bazaar-com.service -n 80 --no-pager || true
            rollback
            exit 1
          fi

          if ! GOOGLE_CONFIG="$(curl -fsS --max-time 10 http://127.0.0.1:8001/api/auth/google/config)"; then
            echo "GOOGLE_CONFIG_ENDPOINT_FAIL"
            rollback
            exit 1
          fi
          if ! printf '%s' "$GOOGLE_CONFIG" | python3 -c 'import json,sys; d=json.load(sys.stdin); ok=bool(d.get("configured") and d.get("client_id")); print("GOOGLE_CONFIGURED="+("YES" if ok else "NO")); sys.exit(0 if ok else 1)'; then
            echo "GOOGLE_OAUTH_CLIENT_ID_NOT_CONFIGURED"
            rollback
            exit 1
          fi

          echo "BACKEND_HEALTH_CHECK_PASS"
          echo "BACKEND_BACKUP=$BACKUP"
          echo "DEPLOYED_COMMIT=$DEPLOY_SHA"
          REMOTE
