name: Inspect KMT Bazaar product API production errors

on:
  push:
    branches:
      - customer-live
    paths:
      - ".github/workflows/product-api-production-diagnostics.yml"

permissions:
  contents: read

jobs:
  inspect-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check SSH configuration
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail
          for key in HOSTINGER_HOST HOSTINGER_USER HOSTINGER_SSH_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required Actions secret: $key"
              exit 1
            fi
          done
          PORT="${HOSTINGER_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" > "$HOME/.ssh/kmt_bazaar_diagnostics_key"
          chmod 600 "$HOME/.ssh/kmt_bazaar_diagnostics_key"
          ssh-keyscan -p "$PORT" -H "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          echo "SSH_READY"

      - name: Read backend service and recent product API errors
        timeout-minutes: 3
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail
          PORT="${HOSTINGER_PORT:-22}"
          DEST="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          RAW="$RUNNER_TEMP/kmt-product-api-journal.log"
          timeout 90s ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$HOME/.ssh/kmt_bazaar_diagnostics_key" -p "$PORT" "$DEST" '
            echo "__SERVICE_STATE__"
            systemctl is-active kmt-bazaar-com.service || true
            echo "__SERVICE_STATUS__"
            systemctl show kmt-bazaar-com.service -p ActiveState -p SubState -p ExecMainStartTimestamp --no-pager || true
            echo "__APP_JOURNAL__"
            journalctl -u kmt-bazaar-com.service --since "24 hours ago" --no-pager -o cat 2>&1 || true
            echo "__NGINX_ERRORS__"
            tail -n 160 /var/log/nginx/error.log 2>/dev/null || true
          ' > "$RAW"
          python3 - "$RAW" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          safe_lines = []
          for line in lines:
              line = re.sub(r"(?i)(authorization\s*[:=]\s*bearer\s+)[^\s,]+", r"\1[REDACTED]", line)
              line = re.sub(r"(?i)((?:access_?token|refresh_?token|password|secret)\s*[:=]\s*)[^\s,]+", r"\1[REDACTED]", line)
              line = re.sub(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", "[EMAIL]", line)
              safe_lines.append(line)

          hits = []
          for i, line in enumerate(safe_lines):
              lower = line.lower()
              if (
                  "__service_" in lower
                  or "__app_journal__" in lower
                  or "__nginx_errors__" in lower
                  or "traceback" in lower
                  or "500 internal server error" in lower
                  or "exception" in lower
                  or ("error" in lower and ("product" in lower or "mongo" in lower or "database" in lower))
                  or (("/api/vendor/products" in lower or "/api/admin/products" in lower) and ("500" in lower or "error" in lower))
                  or "upstream prematurely closed" in lower
                  or "connect() failed" in lower
              ):
                  hits.extend(range(max(0, i-3), min(len(safe_lines), i+36)))

          selected = sorted(set(hits))
          if not selected:
              print("NO_MATCHING_PRODUCT_API_OR_SERVICE_ERRORS_IN_LAST_24H")
              print("TOTAL_JOURNAL_LINES=" + str(len(safe_lines)))
              raise SystemExit(0)

          last = selected[-420:]
          previous = None
          for i in last:
              if previous is not None and i > previous + 1:
                  print("... [log lines omitted] ...")
              print(safe_lines[i])
              previous = i
          print("MATCHED_LOG_LINES=" + str(len(last)))
          PY
